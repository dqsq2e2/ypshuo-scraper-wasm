name: Release Plugin

on:
  push:
    branches:
      - main
    paths:
      - "plugin.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "ui/**"
      - "tests/**"
      - "README.md"
      - ".github/workflows/release.yml"
      - ".github/trpack/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("plugin.yml").read_text(encoding="utf-8")
          match = re.search(r"^version:\s*([^\s#]+)", text, re.M)
          if not match:
              raise SystemExit("plugin.yml version not found")
          version = match.group(1).strip("\"'")
          if Path("Cargo.toml").exists():
              import tomllib
              package_version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
              if package_version != version:
                  raise SystemExit("Cargo.toml and plugin.yml versions differ")
          print(version)
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Tag
        id: check_tag
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Build WASM
        run: cargo build --release --locked --target wasm32-wasip1

      - name: Prepare entry point
        run: cp target/wasm32-wasip1/release/ypshuo_scraper.wasm ypshuo_scraper.wasm

      - name: Package .tr
        shell: bash
        env:
          TRPACK_SIGNING_KEY: ${{ secrets.TRPACK_SIGNING_KEY }}
        run: |
          TRPACK=".github/trpack/linux-x86_64/trpack"
          chmod +x "$TRPACK"
          [[ "$("$TRPACK" --version)" == "trpack 2.0.1" ]]
          mkdir -p dist
          if [[ -z "${TRPACK_SIGNING_KEY:-}" ]]; then
            echo "::error::TRPACK_SIGNING_KEY secret is required for official plugin builds"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/trpack-signing-key.json"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$TRPACK_SIGNING_KEY" > "$KEY_FILE"

          OUT="dist/ypshuo-scraper-wasm-${{ needs.check-version.outputs.version }}.tr"
          "$TRPACK" validate .
          "$TRPACK" build . --output "$OUT" --sign-key "$KEY_FILE"
          "$TRPACK" verify "$OUT"
          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tr
            dist/*.tr.sha256
